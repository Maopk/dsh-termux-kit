[mypy]
# What this gate is for: the tools are scripts without type annotations, so mypy is
# not asked to prove much. It still catches missing names, wrong keyword arguments
# and the "annotate this or mypy gives up" cases, which is worth a CI minute.
#
# Why ignore_missing_imports: the phone's python has modules the runner does not
# (and a few of the tools import Termux-only helpers).
ignore_missing_imports = True
